<!doctype html>
<canvas id=a width=320 height=500></canvas>
<div id=editor class=hidden>
  # cogs size 1 <input type=number id=s1 size=1 value=0 min=0 max=10>
  2 <input type=number id=s2 value=0 min=0 max=10>
  3 <input type=number id=s3 value=0 min=0 max=10>
  4 <input type=number id=s4 value=0 min=0 max=10>
  5 <input type=number id=s5 value=0 min=0 max=10>
  <br>
  <button id=byellow>yellow</button>
  <button id=bblue>blue</button>
  <button id=bred>red</button>
  <button id=bpink>pink</button> - 
  <button id=btest>test</button>
  <button id=breset>reset</button>
  <button id=bshare>share</button>
  <button id=bexit>exit</button>
</div>
<style>
canvas { cursor: pointer;background: #f2f3f4 }
body { margin: 0; text-align: center }
input { width: 25px }
#editor { line-height: 22px; margin-top: -52px; color: #fff; font-family: calibri, arial, sans-serif; }
button { padding: 2px }
.hidden { display: none }
</style>
<script>

// Globals 
page = 2; // 0 menu, 1 ingame, 2 editor, 3 level select
level = 0; // 0-150
c = null; // context2d
md = 0; // mousedown

// Menu
menuangle = 0;

// Editor
level = {
  n1: 0,
  n2: 0,
  n3: 0,
  n4: 0,
  n5: 0,
  yellow: [],
  blue: [],
  red: [],
  pink: [],
}
placing = 0;
pinkclick = 0;
collision = 0;



// draw cog (type 0 grey, 1 yellow, 2 blue, 3 black, 4 red)
// radius: 15, 35, 55, 75, 95
// teeth: 6, 12, 18, 24, 30
// speed: 1, 1/2, 1/3, 1/4, 1/5
drawcog = (x, y, angle = 0, size = 1, type = 0, scale = 1) => {
  c.beginPath();
  c.arc(x, y, 15 + (size - 1) * 20, 0, 7);
  c.fillStyle = ["#ccc", "yellow", "lightblue","black", "red"][type];
  c.strokeStyle = "#000";
  c.lineWidth = 3;
  c.fill();
  c.stroke();
  c.closePath();
  
  c.beginPath();
  c.arc(x, y, 5, 0, 7);
  c.fillStyle = "#000";
  c.fill();
  c.closePath();
  var teeth = size * 6;
  for(var i = 0; i < teeth; i++){
    c.save();
    c.translate(x, y);
    c.rotate((2 * Math.PI / teeth) * i + (angle * 1/size) / 100);
    c.translate(0, -25 - (size - 1) * 20);
    c.fillRect(-6, 0, 12, 12);
    c.fillStyle = c.fillStyle = ["#ccc", "yellow", "lightblue", "black", "red"][type];
    c.fillRect(-3, 3, 6, 12);
    c.restore();
  }
}

drawred = () => {
  c.beginPath();
  c.fillStyle = "pink";
  c.lineWidth = 3;
  c.strokeStyle = "red";
  c.rect(level.red[0],level.red[1],level.red[2],level.red[3]);
  c.fill();
  c.stroke();
  c.closePath();
}

drawpink = () => {
  c.beginPath();
  c.fillStyle = "#e7e";
  c.lineWidth = 3;
  c.strokeStyle = "purple";
  c.rect(level.pink[0],level.pink[1],level.pink[2],level.pink[3]);
  c.fill();
  c.stroke();
  c.closePath();
  if(level.pink.length > 4){
    c.beginPath();
    c.fillStyle = "#e7e";
    c.lineWidth = 3;
    c.strokeStyle = "purple";
    c.arc(level.pink[4], level.pink[5], 10, 0, 7);
    c.fill();
    c.stroke();
    c.closePath();
    
    c.beginPath();
    c.fillStyle = "#e7e";
    c.lineWidth = 3;
    c.strokeStyle = "purple";
    c.moveTo(level.pink[4], level.pink[5]);
    c.lineTo(level.pink[0] + (level.pink[2])/2, level.pink[1] + (level.pink[3])/2);
    c.fill();
    c.stroke();
    c.closePath();
  }
}

// render
render = () => {

  a.width ^= 0;
  menuangle+= 100;
  console.log(level.red);
  
  // menu
  if(page == 0){
    editor.classList.add("hidden");
    c.font = "bold 120px Calibri, Arial, sans-serif";
    c.fillText("C   GS", 15, 230);
    drawcog(118,192,menuangle+80,2,2);
    drawcog(118,130,-menuangle+90,1,0);
    drawcog(118,7,menuangle+155,5,1);
    drawcog(250,310,0,3,0);
    drawcog(58,420,0,2,2);
    c.font = "bold 50px Calibri, Arial, sans-serif";
    c.fillText("PLAY", 25, 320);
    c.fillText("EDITOR", 135, 415);
    c.font = "17px Calibri, Arial, sans-serif";
    c.fillText("A tribute to 'Geared' for GamedevJS 2026", 20, 490);
  }
  
  // game
  else if(page == 1){
    c.font = "bold 120px Calibri, Arial, sans-serif";
    c.fillText("1", 15, 230);
  }
  
  // editor
  else if(page == 2){
    editor.classList.remove("hidden");

    // red
    if(level.red.length == 4){
      drawred();
    }
    
    // pink
    if(level.pink.length >= 4){
      drawpink();
    }
    
    // yellow
    if(level.yellow.length){
      drawcog(level.yellow[0],level.yellow[1],-menuangle,5, (placing == "yellow" && collision) ? 4 : 1);
    }
    
    // blue
    if(level.blue.length){
      for(var i in level.blue){
        drawcog(level.blue[i][0],level.blue[i][1],0,3, (placing == "blue" && collision && i == level.blue.length-1) ? 4 : 2);
      }
    }
    
    c.fillStyle = "#000";
    c.fillRect(0,450,320,50);
  }
  
  // levels
  else if(page == 3){
    c.font = "bold 120px Calibri, Arial, sans-serif";
    c.fillText("3", 15, 230);
  }
}

a.onclick = (e) => {
  var x = e.layerX - a.offsetLeft, y = e.layerY - a.offsetTop;
  
  // menu
  if(page == 0){
    c.beginPath();
    c.rect(25, 270, 130, 50); // play
    if(c.isPointInPath(x,y)){
      page = 1;
    }
    c.closePath();
    
    c.beginPath();
    c.rect(135, 370, 160, 50); // editor
    if(c.isPointInPath(x,y)){
      page = 2;
      reseteditor();
    }
    c.closePath();
  }
  
  // editor
  if(page == 2){
    if(!collision && placing != 0){
      if(placing == "yellow") { 
        placing = 0;
      }
      if(placing == "blue") { 
        placing = 0;
      }
      if(placing == "red") { 
        if(level.red.length == 0){
          level.red = [x, y];
        }
        else if(level.red.length == 2 || level.red.length == 4){
          level.red[2] = (x - level.red[0]);
          level.red[3] = (y - level.red[1]);
          placing = 0;
        }
      }
      if(placing == "pink") { 
        if(pinkclick == 0){
          level.pink = [x, y];
          pinkclick++;
        }
        else if(pinkclick == 1){
          level.pink[2] = (x - level.pink[0]);
          level.pink[3] = (y - level.pink[1]);

          pinkclick++;
        }
        else if(pinkclick == 2){
          level.pink[4] = (x);
          level.pink[5] = (y);
          placing = 0;
          pinkclick = 0;
        }
      }
    }
  }
}

onmousedown = () => {
  md = 1;
}

onmouseup = () => {
  md = 0;
}

onmousemove = (e) => {
  var x = e.layerX - a.offsetLeft, y = e.layerY - a.offsetTop;
  
  // editor
  if(page == 2){
    
    // yellow
    if(placing == "yellow"){
      level.yellow = [x, y];
    }
    
    // blue
    if(placing == "blue"){
      level.blue[level.blue.length-1] = [x, y];
    }
    
    // red
    if(placing == "red" && level.red.length >= 2){
      level.red[2] = x - level.red[0];
      level.red[3] = y - level.red[1];
    }
    
    // pink
    if(placing == "pink" && pinkclick == 1){
      level.pink[2] = x - level.pink[0];
      level.pink[3] = y - level.pink[1];
    }
    
    if(placing == "pink" && pinkclick == 2){
      level.pink[4] = x;
      level.pink[5] = y;
    }
    
    checkeditorcollisions();
  }
}


// Editor stuff 
ininput = onchange = () => {
  if(page == 2){
    level.n1 = s1.value;
    level.n2 = s2.value;
    level.n3 = s3.value;
    level.n4 = s4.value;
    level.n5 = s5.value;
  }
}

breset.onclick = reseteditor = () => {
  s1.value = 0;
  s2.value = 0;
  s3.value = 0;
  s4.value = 0;
  s5.value = 0;
  level = {
    n1: 0,
    n2: 0,
    n3: 0,
    n4: 0,
    n5: 0,
    yellow: [],
    blue: [],
    red: [],
    pink: [],
  }
}

bshare.onclick = () => {
  alert(JSON.stringify(level));
}

bexit.onclick = () => {
  page = 0;
}

byellow.onclick = () => {
  placing = "yellow";
}

bblue.onclick = () => {
  placing = "blue";
  if(level.blue.length > 0 && level.blue[level.blue.length-1][0] == 999){
    // use the last blue slot if empty
  }
  else {
    level.blue.push([999,999]); // new one
  }
}

bred.onclick = () => {
  placing = "red";
  level.red = [];
}

bpink.onclick = () => {
  placing = "pink";
  level.pink = [];
  pinkclick = 0;
}

circlescollide = (x1, y1, r1, x2, y2, r2) => {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const distSq = dx*dx + dy*dy;        // distance au carré
  const radii = r1 + r2;
  return distSq <= radii * radii;      // compare distances, sans sqrt
}

checkeditorcollisions = () => {
  // blue radius is 55
  // yellow radius is 95
  collision = 0;
  if(placing == "yellow"){
    for(var i of level.blue){
      if(circlescollide(level.yellow[0], level.yellow[1], 95, i[0], i[1], 55)){
        collision = 1;
      }
    }
  }
  
  if(placing == "blue" && level.blue.length > 1){
    for(var i = 0; i < level.blue.length - 1; i++){
      if(circlescollide(level.blue[level.blue.length-1][0], level.blue[level.blue.length-1][1], 55, level.blue[i][0], level.blue[i][1], 55)){
        collision = 1;
      }
    }
  }
  if(placing == "blue" && level.yellow.length && circlescollide(level.yellow[0], level.yellow[1], 95, level.blue[level.blue.length-1][0], level.blue[level.blue.length-1][1], 55)){
    collision = 1;
  }
}


// Start
onload = () => {
  c = a.getContext("2d");
  setInterval(render, 16);
}
</script>
