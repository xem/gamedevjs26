// meta
const target = 360;
const scale = window.screen.width / target;
const meta = document.createElement('meta');
meta.name = "viewport";
meta.content =
  `width=${target}, initial-scale=${scale}, maximum-scale=${scale}, user-scalable=no`;
document.head.appendChild(meta); 

// touch
function isHandheld() {
  const ua = navigator.userAgent.toLowerCase();
  if (/mobile|android|iphone|ipod|ipad|tablet|silk|playbook|windows phone/.test(ua))
    return true;
  if (/macintosh/.test(ua) && navigator.maxTouchPoints > 1)
    return true;
  return false;
}

hashlevel = 0;

  parselevel();
  location.hash = "";
}
