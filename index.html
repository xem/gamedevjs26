<!doctype html>
<canvas id=a width=320 height=490></canvas>
<style>
canvas { cursor: pointer;background: #f2f3f4 }
body { margin: 0; text-align: center }
</style>
<script>
page = 0; // 0 menu, 1 ingame, 2 editor, 3 level select
level = 0; // 0-150
c = null; // context2d
menuangle = 0;

// draw cog
drawcog = (x, y, angle = 0, size = 1, type = 0) => {
  c.beginPath();
  c.arc(x, y, 15 + (size - 1) * 20, 0, 7);
  c.fillStyle = ["#ccc", "yellow", "lightblue"][type];
  c.strokeStyle = "#000";
  c.lineWidth = 3;
  c.fill();
  c.stroke();
  c.closePath();
  
  c.beginPath();
  c.arc(x, y, 5, 0, 7);
  c.fillStyle = "#000";
  c.fill();
  c.closePath();
  var teeth = [0, 6, 12, 18, 24, 30][size];
  for(var i = 0; i < teeth; i++){
    c.save();
    c.translate(x, y);
    c.rotate((2 * Math.PI / teeth) * i + (angle * [0, 1, 1/2, 1/3, 1/4, 1/5][size]) / 100);
    c.translate(0, -25 - (size - 1) * 20);
    c.fillRect(-6, 0, 12, 12);
    c.fillStyle = c.fillStyle = ["#ccc", "yellow", "lightblue"][type];
    c.fillRect(-3, 3, 6, 12);
    c.restore();
  }
}

// render
render = () => {

  a.width ^= 0;
  
  // menu
  if(page == 0){
    c.font = "bold 120px Calibri, Arial, sans-serif";
    c.fillText("C   GS", 15, 230);
    menuangle+= 100;
    drawcog(118,192,menuangle+80,2,2);
    drawcog(118,130,-menuangle+90,1,0);
    drawcog(118,7,menuangle+155,5,1);
    drawcog(250,310,0,3,0);
    drawcog(58,420,0,2,2);
    c.font = "bold 50px Calibri, Arial, sans-serif";
    c.fillText("PLAY", 25, 320);
    c.fillText("EDITOR", 135, 415);
    c.font = "18px Calibri, Arial, sans-serif";
    c.fillText("A tribute to 'Geared' for GamedevJS 2026", 10, 485);
  }
  
  // game
  else if(page == 1){
    c.font = "bold 120px Calibri, Arial, sans-serif";
    c.fillText("1", 15, 230);
  }
  
  // editor
  else if(page == 2){
    c.font = "bold 120px Calibri, Arial, sans-serif";
    c.fillText("2", 15, 230);
  }
  
  // levels
  else if(page == 3){
    c.font = "bold 120px Calibri, Arial, sans-serif";
    c.fillText("3", 15, 230);
  }
}

a.onclick = (e) => {
  var x = e.layerX - a.offsetLeft, y = e.layerY - a.offsetTop;
  console.log(x,y);
  
  // menu
  if(page == 0){
    c.beginPath();
    c.rect(25, 270, 130, 50); // play
    if(c.isPointInPath(x,y)){
      page = 1;
    }
    c.closePath();
    
    c.beginPath();
    c.rect(135, 370, 160, 50); // editor
    if(c.isPointInPath(x,y)){
      page = 2;
    }
    c.closePath();
  }
}


onload = () => {
  c = a.getContext("2d");
  setInterval(render, 16);
}
</script>
